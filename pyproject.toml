[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mybooklist"
version = "1.0.0"
description = "Gerenciador de biblioteca pessoal com interface gráfica em CustomTkinter"
readme = "README.md"
license = "MIT"
authors = [{ name = "Angelo Treptow" }]
requires-python = ">=3.10"
dependencies = [
    "customtkinter~=6.0",
    "Pillow~=12.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "ruff~=0.15",
]

[project.urls]
Repository = "https://github.com/AngeloTreptow/MyBookList"

[tool.setuptools.packages.find]
include = ["mybooklist*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W: estilo (pycodestyle) · F: erros (pyflakes) · I: ordenação de imports
# UP: modernização de sintaxe · B: prováveis bugs (bugbear)
select = ["E", "W", "F", "I", "UP", "B"]
